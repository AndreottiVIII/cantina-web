<style>
:root{--bg:#faf7f2;--fg:#2a2220;--mut:#7a6d66;--card:#fff;--line:#e4dcd2;--acc:#7b1e3a;--red:#c0262d}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,Segoe UI,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

button{width:100%;margin-top:12px;padding:10px;font:inherit;font-weight:600;color:#fff;background:var(--acc);border:0;border-radius:8px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label.r{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:14px}
#msg{min-height:20px;margin-top:10px;color:var(--red);font-size:14px}
</style></head><body>

var CH="cantina-chiave-"+SALE;
var f=document.getElementById("f"),pw=document.getElementById("pw"),ric=document.getElementById("ric"),
    ok=document.getElementById("ok"),msg=document.getElementById("msg");
function da64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function a64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function leggi(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function scrivi(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function togli(k){try{localStorage.removeItem(k);}catch(e){}}
function apri(html){document.open();document.write(html);document.close();}
function decifra(k){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:da64(IV)},k,da64(CT)).then(function(b){return new TextDecoder().decode(b);});
}
function errore(){msg.textContent="Password non corretta.";pw.value="";pw.focus();ok.disabled=false;ok.textContent="Apri";}
var cifrabile=!!(window.crypto&&crypto.subtle);
if(!cifrabile){msg.textContent="Questo browser non puo aprire la pagina (serve una connessione https).";ok.disabled=true;}
var salvata=leggi(CH);
if(salvata&&cifrabile){
  crypto.subtle.importKey("raw",da64(salvata),{name:"AES-GCM"},false,["decrypt"]).then(decifra).then(apri).catch(function(){togli(CH);});
}
f.addEventListener("submit",function(e){
  e.preventDefault();
  if(!pw.value||!cifrabile)return;
  ok.disabled=true;ok.textContent="Apro...";msg.textContent="";
  crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:da64(SALE),iterations:GIRI,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  }).then(function(k){
    return decifra(k).then(function(html){
      if(ric.checked){return crypto.subtle.exportKey("raw",k).then(function(r){scrivi(CH,a64(new Uint8Array(r)));return html;});}
      togli(CH);return html;
    });
  }).then(apri).catch(errore);
});
